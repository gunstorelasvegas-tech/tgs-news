<!-- Paste this into a Custom HTML / Embed block on your BizlyApp page.
     Replace gunstorelasvegas-tech and tgs-news with your GitHub names. -->
<iframe id="tgs-news" src="https://gunstorelasvegas-tech.github.io/tgs-news/"
        title="TGS News" style="width:100%;min-height:900px;border:0;display:block" scrolling="no" loading="lazy"></iframe>
<script>
  // grows the frame to fit the news list (no inner scrollbar)
  window.addEventListener("message", function (e) {
    if (e.data && e.data.tgsHeight) document.getElementById("tgs-news").style.height = e.data.tgsHeight + "px";
  });
</script>
