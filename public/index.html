<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGS News</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0c0c0c; --panel:#1a1a1a; --line:#333; --text:#fff; --mute:#a3a3a3; --red:#E61E2A; --ink:#0c0c0c; --ink-mute:#5c5c57; --card-line:#E5E5DF; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 Inter,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:#070707; border-bottom:3px solid var(--red); }
  .brand { max-width:1100px; margin:auto; padding:16px 20px; display:flex; align-items:center; gap:16px; }
  .brand img { width:72px; height:72px; border-radius:50%; background:#fff; object-fit:cover; flex:none; }
  h1 { margin:0; font-size:1.9rem; font-weight:900; letter-spacing:.02em; text-transform:uppercase; }
  .sub { color:var(--mute); font-size:.85rem; margin-top:2px; }
  .controls { max-width:1100px; margin:auto; padding:14px 20px 8px; display:flex; flex-wrap:wrap; gap:10px; position:sticky; top:0; background:var(--bg); z-index:5; }
  input, select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; }
  input:focus, select:focus { outline:2px solid var(--red); border-color:var(--red); }
  input { flex:1 1 240px; }
  .chips { max-width:1100px; margin:auto; padding:0 20px 8px; display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; font-size:.85rem; }
  .chip:hover { border-color:var(--red); }
  .chip.on { background:var(--red); color:#fff; border-color:var(--red); }
  main { max-width:1100px; margin:auto; padding:8px 20px 60px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
  .day { grid-column:1/-1; margin:14px 0 0; font-size:.85rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--red); border-bottom:1px solid var(--line); padding-bottom:6px; }
  article { background:#fff; color:var(--ink); border:1px solid var(--card-line); border-top:4px solid var(--red); border-radius:10px; padding:0 0 16px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  article > :not(.thumb) { margin:0 16px; }
  .thumb { display:block; position:relative; aspect-ratio:16/9; overflow:hidden; container-type:inline-size; color:#fff;
    background:#0c0c0c center/cover no-repeat; }
  .thumb::before { content:""; position:absolute; inset:0; z-index:0;
    background:linear-gradient(90deg,rgba(7,7,7,.92) 0%,rgba(7,7,7,.7) 42%,rgba(7,7,7,.05) 78%),
               linear-gradient(0deg,rgba(7,7,7,.55),transparent 45%); }
  .thumb::after { content:""; position:absolute; left:0; bottom:0; height:2.2cqw; width:100%; background:var(--red); z-index:2; }
  .thumb.nobg { background-image:radial-gradient(circle at 80% 30%,#5a0c12,#0c0c0c 65%); }
  .thumb .hl { position:absolute; z-index:1; left:5cqw; top:50%; transform:translateY(-52%); max-width:62cqw;
    font-weight:900; text-transform:uppercase; line-height:.98; letter-spacing:-.01em; font-size:10.5cqw;
    text-shadow:0 .5cqw 0 rgba(0,0,0,.65),0 0 2cqw rgba(0,0,0,.8); -webkit-text-stroke:.35cqw rgba(0,0,0,.55); paint-order:stroke fill; }
  .thumb .hl.sm { font-size:8.2cqw; }
  .thumb .hl em { font-style:normal; color:#ffd400; }
  .thumb .hl em.r { color:var(--red); text-shadow:0 .5cqw 0 #000,0 0 2.5cqw rgba(230,30,42,.6); }
  .thumb .chip2 { position:absolute; z-index:2; left:4cqw; top:4cqw; background:var(--red); color:#fff; font-weight:800;
    font-size:3.2cqw; letter-spacing:.08em; text-transform:uppercase; padding:.6cqw 2.2cqw; border-radius:.8cqw; transform:skew(-8deg); }
  .thumb .lg { position:absolute; z-index:2; right:3.5cqw; top:3.5cqw; width:11cqw; height:11cqw; border-radius:50%;
    background:#fff url(logo.jpg) center/cover; box-shadow:0 0 0 .6cqw #fff,0 1cqw 3cqw rgba(0,0,0,.6); }
  article h2 { font-size:1.05rem; margin:0; line-height:1.3; font-weight:700; }
  article a { color:inherit; text-decoration:none; }
  article a:hover h2 { color:var(--red); text-decoration:underline; }
  .meta { font-size:.78rem; color:var(--ink-mute); display:flex; flex-wrap:wrap; gap:6px 10px; }
  .badge { color:var(--red); font-weight:700; }
  .sum { font-size:.9rem; color:var(--ink-mute); margin:0; }
  .new { background:var(--red); color:#fff; font-size:.65rem; font-weight:700; padding:1px 6px; border-radius:4px; margin-right:6px; vertical-align:middle; }
  .empty, .err { grid-column:1/-1; text-align:center; color:var(--mute); padding:40px; }
  button.more { grid-column:1/-1; justify-self:center; padding:10px 24px; border-radius:8px; border:0; background:var(--red); color:#fff; font-weight:700; cursor:pointer; font:inherit; font-weight:700; }
  button.more:hover { filter:brightness(1.1); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.jpg" alt="The Gun Store logo">
    <div>
      <h1>TGS News</h1>
      <div class="sub" id="status">Loading…</div>
    </div>
  </div>
</header>
<div class="controls">
  <input id="q" type="search" placeholder="Search articles (e.g. NFA, suppressor, Glock)…">
  <select id="src"><option value="">All sources</option></select>
  <select id="range">
    <option value="1">Today (24h)</option>
    <option value="7">Past week</option>
    <option value="30" selected>Past month</option>
    <option value="0">All</option>
  </select>
</div>
<div class="chips" id="chips"></div>
<main id="list"></main>

<script src="tgs-thumb.js"></script>
<script>
const PAGE = 36;
let data = null, cat = "", shown = PAGE;
const $ = id => document.getElementById(id);


async function load() {
  try {
    const r = await fetch("feed.json?t=" + Date.now());
    data = await r.json();
  } catch (e) {
    $("status").textContent = "";
    $("list").innerHTML = '<div class="err">News feed is temporarily unavailable. Please check back shortly.</div>';
    return;
  }
  const g = new Date(data.metadata.generated_at);
  $("status").textContent = `${data.metadata.total_items} articles · ${data.metadata.sources_count} sources · updated ${g.toLocaleString()}`;
  if (!$("src").options[1]) {
    data.sources.forEach(s => $("src").add(new Option(s.name, s.id)));
    const cats = [...new Map(data.sources.map(s => [s.category, s.category_label])).entries()];
    $("chips").innerHTML = '<button class="chip on" data-c="">All</button>' +
      cats.map(([c, l]) => `<button class="chip" data-c="${esc(c)}">${esc(l)}</button>`).join("");
  }
  render();
}

function render() {
  const q = $("q").value.toLowerCase().trim(), s = $("src").value, days = +$("range").value;
  const cutoff = days ? Date.now()/1000 - days*86400 : 0;
  const items = data.items.filter(i =>
    (!cat || i.category === cat) && (!s || i.source_id === s) && i.timestamp >= cutoff &&
    (!q || (i.title + " " + i.summary + " " + i.source_name).toLowerCase().includes(q)));
  const out = []; let lastDay = "";
  items.slice(0, shown).forEach(i => {
    const d = new Date(i.timestamp*1000), day = d.toDateString();
    if (day !== lastDay) { out.push(`<h3 class="day">${day === new Date().toDateString() ? "Today" : d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</h3>`); lastDay = day; }
    const fresh = Date.now()/1000 - i.timestamp < 6*3600;
    out.push(`<article>
      ${thumb(i)}
      <div class="meta"><span class="badge">${esc(i.source_name)}</span><span>${d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span><span>${esc(i.category_label)}</span></div>
      <a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer"><h2>${fresh ? '<span class="new">NEW</span>' : ""}${esc(i.title)}</h2></a>
      ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : ""}</article>`);
  });
  if (!items.length) out.push('<div class="empty">No articles match.</div>');
  if (items.length > shown) out.push(`<button class="more" onclick="shown+=PAGE;render()">Load more (${items.length - shown} left)</button>`);
  $("list").innerHTML = out.join("");
}

["q","src","range"].forEach(id => $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.c; shown = PAGE;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  render();
});
if (parent !== window) {
  const postH = () => parent.postMessage({ tgsHeight: document.documentElement.scrollHeight }, "*");
  new ResizeObserver(postH).observe(document.body);
  addEventListener("load", postH);
}
load();
setInterval(load, 5*60*1000); // re-read feed.json every 5 minutes
</script>
</body>
</html>
